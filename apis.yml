aid: roblox-engine-api
name: Roblox Engine API
description: >-
  Roblox provides a suite of developer APIs for building experiences on the Roblox platform. The Engine API documents
  all classes, data types, enumerations, functions, events, callbacks, and properties for in-experience scripting in
  Luau. The Open Cloud REST API provides external programmatic access to Roblox platform resources including
  experiences, places, data stores, users, groups, assets, messaging, and more. In March 2026 Roblox launched new
  unified Open Cloud reference documentation.
